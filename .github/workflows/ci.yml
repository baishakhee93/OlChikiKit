
name: Kotlin Multiplatform CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  jvm-tests:
    name: JVM Tests and Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapper-validation: 'off'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Run JVM tests
        run: ./gradlew :sdk:jvmTest --stacktrace

      - name: Run JVM example
        run: ./gradlew :examples:jvm:run --stacktrace

  ios-tests:
    name: iOS Simulator Tests
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          wrapper-validation: 'off'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run iOS Simulator tests
        run: ./gradlew :sdk:iosSimulatorArm64Test --stacktrace